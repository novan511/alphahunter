name: AI Arena step

# Iterasi arena AI tiap 2 menit via GitHub Actions (Vercel Hobby hanya izinkan
# cron harian). Route /api/arena action=step menjalankan satu step untuk semua
# agent yang running, mengelola posisi, dan memanggil LLM kalau ada bar baru.
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

concurrency:
  group: arena-step
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger arena step
        env:
          DEPLOY_URL: ${{ secrets.VERCEL_URL }}
          ARENA_TOKEN: ${{ secrets.ARENA_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_URL}" ]; then
            echo "::error::VERCEL_URL wajib diisi"
            exit 1
          fi
          if [ -z "${ARENA_TOKEN}" ]; then
            echo "::error::ARENA_CONTROL_TOKEN wajib diisi di Settings > Secrets > Actions"
            exit 1
          fi
          echo "POST ${DEPLOY_URL}/api/arena (action=step)"
          RESP=$(curl --silent --show-error --max-time 120 \
            -o /tmp/arena-step.json -w '%{http_code}' \
            -X POST "${DEPLOY_URL}/api/arena" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ARENA_TOKEN}" \
            -d '{"action":"step","force":false}')
          echo "HTTP ${RESP}"
          cat /tmp/arena-step.json
          echo
          if [ "${RESP}" != "200" ]; then
            echo "::error::arena step HTTP ${RESP} (401 = token salah/belum diset di GitHub Secrets)"
            exit 1
          fi
          python3 -c "
          import json,sys
          try:
              d = json.load(open('/tmp/arena-step.json'))
          except Exception as e:
              print(f'::error::gagal parse response: {e}')
              sys.exit(1)
          if not d.get('ok', False):
              print(f\"::error::arena step not ok: {d.get('error') or d.get('note')}\")
              sys.exit(1)
          results = d.get('results', [])
          ok_count = sum(1 for r in results if r.get('ok'))
          print(f\"ran={d.get('ran')} ok={ok_count}/{len(results)}\")
          failed = [r for r in results if not r.get('ok')]
          for r in results:
              err = r.get('error', '')
              print(f\"  {r['model']}: ok={r['ok']} error={err[:80] if err else '-'}\")
          # gagal total (0 agent jalan) = error; sebagian gagal cukup warning
          if results and not ok_count:
              sys.exit(1)
          "
